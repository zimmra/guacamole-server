name: Build custom guacd image

# This workflow intentionally runs only when manually requested. It must exist
# on the default branch, but always builds the custom development branch.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GitHub Container Registry
        required: true
        default: false
        type: boolean

concurrency:
  group: guacamole-server-manual-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SOURCE_BRANCH: dev/1.6.0-custom

jobs:
  docker_build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record source revision
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build custom guacd image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: ${{ inputs.publish }}
          tags: |
            ${{ env.IMAGE_NAME }}:1.6.0-custom
            ${{ env.IMAGE_NAME }}:sha-${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=1.6.0-custom
          cache-from: type=gha,scope=guacd-1.6.0-custom
          cache-to: type=gha,mode=max,scope=guacd-1.6.0-custom

      - name: Summarize build
        shell: bash
        run: |
          {
            echo "## Custom guacd build"
            echo
            echo "- Source branch: \`${SOURCE_BRANCH}\`"
            echo "- Source commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Published: \`${{ inputs.publish }}\`"
            if [[ "${{ inputs.publish }}" == "true" ]]; then
              echo "- Image: \`${IMAGE_NAME}:1.6.0-custom\`"
              echo "- Immutable tag: \`${IMAGE_NAME}:sha-${{ steps.source.outputs.short_sha }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
